# Environment for the Demucs vocal separator. Created by "Install engine" (uv sync).
[project]
name = "dubbing-engine-demucs"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "demucs>=4.1",
    # RTX 50xx needs torch 2.7+ (CUDA 12.8); Intel macOS is pinned to torch<2.3 by demucs.
    "torch>=2.7; sys_platform != 'darwin'",
    "torch; sys_platform == 'darwin'",
    "soundfile",
    "numpy",
]

[tool.uv]
package = false

# CUDA 12.8 build of PyTorch: works on RTX 20xx-50xx. macOS gets the default build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
