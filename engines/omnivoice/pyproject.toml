# Environment for the OmniVoice engine. Created by "Install engine" (uv sync).
[project]
name = "dubbing-engine-omnivoice"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "omnivoice>=0.1.5",
    "torch>=2.7",
    "torchaudio>=2.7",
    "numpy",
    "soundfile",
]

[tool.uv]
package = false

# CUDA 12.8 build of PyTorch: works on RTX 20xx-50xx. macOS gets the default build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
