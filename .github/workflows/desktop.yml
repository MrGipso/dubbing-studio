# Builds the Windows installer of the desktop app and attaches it to a draft
# GitHub release. Run it by hand from the Actions tab with the version tag
# (v0.2.0, ...).
name: Desktop installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag, for example v0.2.0
        required: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Python tests
        run: uv run python -m unittest discover tests
        env:
          PYTHONIOENCODING: utf-8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          tagName: ${{ inputs.tag }}
          releaseName: Dubbing Studio ${{ inputs.tag }}
          releaseDraft: true
