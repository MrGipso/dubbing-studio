[project]
name = "dubbing-studio"
version = "0.1.0"
description = "Local video/audio dubbing: Whisper -> any LLM translator -> any TTS engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    # faster-whisper 1.2.x passes metadata_errors to av.open(), dropped in PyAV 18.
    "av>=11,<18",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]
# cuBLAS for Whisper on NVIDIA GPUs without a CUDA Toolkit (CTranslate2 ships cuDNN itself).
# The desktop app adds it when it finds an NVIDIA GPU: uv sync --extra cuda
cuda = ["nvidia-cublas-cu12>=12.4; sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv]
package = false
